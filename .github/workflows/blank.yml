name: Build PC Virtual FiveM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar PC Virtual
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # ⚠️ Se der erro de versão, troque para '6.0.x'
          dotnet-version: '8.0.x'

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar projeto
        run: dotnet build --configuration Release --no-restore

      - name: Gerar EXE pronto
        run: dotnet publish --configuration Release --no-build -o ./saida

      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: PC-Virtual-Pronto
          path: ./saida
